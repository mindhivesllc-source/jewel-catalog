# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "33c519b66f9203979eb9e65f469dbfc3"
name = "jewel-catalog"
application_url = "https://honest-heart-production-55ec.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_locations,read_products,read_publications,write_inventory,write_metaobject_definitions,write_metaobjects,write_products,write_publications"

[auth]
redirect_urls = [
  "https://honest-heart-production-55ec.up.railway.app/auth/callback"
]
